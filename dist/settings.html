<!doctype html>
<html><head><meta charset="utf-8"><title>Bambuddy Monitor settings</title><link rel="stylesheet" href="style.css"></head>
<body>
  <label for="url">Bambuddy URL</label><input id="url" placeholder="https://bambuddy.example.com">
  <label for="key">API key</label><input id="key" type="password" placeholder="bb_… (Bambuddy › Settings › API Keys)">
  <label for="printer">Printer</label>
  <div class="row"><select id="printer"><option value="">All printers</option></select><button id="load">Load printers</button></div>
  <label class="check"><input id="hide" type="checkbox"> Hide the window after a print ends</label>
  <label class="check"><input id="upd" type="checkbox"> Check for new versions daily</label>
  <div class="group">Alerts</div>
  <div id="alerts"></div>
  <div class="row" style="justify-content:flex-start"><button id="test">Send test notification</button></div>
  <div id="note"></div>
  <div class="row" style="justify-content:flex-end"><button id="cancel">Cancel</button><button id="save" class="danger" style="background:var(--acc);border-color:var(--acc)">Save</button></div>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);
let cfg;
const ALERTS = [
  ["finished", "Print finished"], ["failed", "Print failed or stopped"], ["paused", "Print paused"],
  ["error", "Printer warnings, including out of filament"], ["filament_low", "Filament low (spool in use at 15% or less)"],
  ["offline", "Printer goes offline"], ["open_window", "Open the window for alerts that need you"],
];
$("alerts").innerHTML = ALERTS.map(([k, label]) => `<label class="check"><input type="checkbox" data-k="${k}"> ${label}</label>`).join("");
$("test").onclick = async () => {
  $("note").textContent = "Sending…";
  try { await invoke("test_alert"); $("note").textContent = "Sent. If you saw nothing, check your desktop's notification settings (Do Not Disturb?)."; }
  catch (e) { $("note").textContent = `Couldn't send: ${e}`; }
};

async function loadPrinters() {
  try {
    const list = await invoke("list_printers", { url: $("url").value, key: $("key").value });
    $("printer").innerHTML = '<option value="">All printers</option>' +
      list.map((p) => `<option value="${p.id}">${p.name.replace(/</g, "&lt;")}</option>`).join("");
    $("printer").value = cfg.printer_id ?? "";
    $("note").textContent = `Connected, ${list.length} printer(s).`;
  } catch (e) { $("note").textContent = String(e); }
}

$("load").onclick = loadPrinters;
$("cancel").onclick = () => window.close();
$("save").onclick = async () => {
  const next = { ...cfg, url: $("url").value.trim().replace(/\/+$/, ""), api_key: $("key").value.trim(),
    printer_id: $("printer").value ? Number($("printer").value) : null, auto_hide: $("hide").checked, check_updates: $("upd").checked,
    alerts: Object.fromEntries([...document.querySelectorAll("[data-k]")].map((i) => [i.dataset.k, i.checked])) };
  try { await invoke("save_config", { cfg: next }); window.close(); } catch (e) { $("note").textContent = String(e); }
};

invoke("get_config").then((c) => {
  cfg = c; $("url").value = c.url; $("key").value = c.api_key; $("hide").checked = c.auto_hide; $("upd").checked = c.check_updates;
  document.querySelectorAll("[data-k]").forEach((i) => { i.checked = c.alerts[i.dataset.k]; });
  if (c.url) loadPrinters();
});
</script></body></html>
